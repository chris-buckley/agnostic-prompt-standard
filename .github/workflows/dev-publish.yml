name: Dev Build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/aps-cli-node/package-lock.json
      - name: Install and test
        working-directory: packages/aps-cli-node
        run: npm ci --ignore-scripts && npm test
      - name: Set dev version
        working-directory: packages/aps-cli-node
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm version "${VERSION}-dev.${GITHUB_RUN_NUMBER}" --no-git-tag-version
      - name: Pack
        working-directory: packages/aps-cli-node
        run: npm pack
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: packages/aps-cli-node/*.tgz

  dev-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -U pip build
          python -m pip install -e "packages/aps-cli-py[dev]"
          pytest -q packages/aps-cli-py/tests
      - name: Set dev version and build
        run: |
          VERSION=$(python -c "
          import re
          text = open('skill/agnostic-prompt-standard/SKILL.md').read()
          m = re.search(r'framework_revision:\s*\"?([0-9]+\.[0-9]+\.[0-9]+)\"?', text)
          print(m.group(1))
          ")
          DEV="${VERSION}.dev${GITHUB_RUN_NUMBER}"
          sed -i "s/version = \"${VERSION}\"/version = \"${DEV}\"/" packages/aps-cli-py/pyproject.toml
          sed -i "s/__version__ = \"${VERSION}\"/__version__ = \"${DEV}\"/" packages/aps-cli-py/src/aps_cli/__init__.py
          python tools/sync_payload.py --python
          python -m build --outdir dist packages/aps-cli-py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
