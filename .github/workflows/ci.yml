name: APS CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/aps-cli-node/package-lock.json

      - name: Verify release version consistency
        run: python tools/check_versions.py

      - name: Run release tooling unit tests
        run: |
          python tools/test_bump_version.py
          python tools/test_auto_bump_version.py

      - name: Install Python CLI test dependencies
        run: python -m pip install -e "packages/aps-cli-py[dev]"

      - name: Run Python CLI tests
        run: python -m pytest -q packages/aps-cli-py/tests

      - name: Install Node CLI dependencies
        run: npm ci --prefix packages/aps-cli-node --ignore-scripts

      - name: Run Node CLI tests
        run: npm test --prefix packages/aps-cli-node
